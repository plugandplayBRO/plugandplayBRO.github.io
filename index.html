<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS Router & Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BroOS Router Bridge</h1>
        <p class="status-subtitle">Sistem de rețea pentru conectare Player 1 & Player 2</p>

        <div class="boards-container">
            <!-- Panou Player 1 -->
            <div class="card" id="card-p1">
                <h2>Player 1 (BroOS #1)</h2>
                <div class="status-badge disconnected" id="p1-status">Deconectat</div>
                <button class="btn" id="p1-connect-btn">Conectează Port Serial P1</button>
                <div class="log-box" id="p1-log"></div>
            </div>

            <!-- Panou Player 2 -->
            <div class="card" id="card-p2">
                <h2>Player 2 (BroOS #2)</h2>
                <div class="status-badge disconnected" id="p2-status">Deconectat</div>
                <button class="btn" id="p2-connect-btn">Conectează Port Serial P2</button>
                <div class="log-box" id="p2-log"></div>
            </div>
        </div>

        <div class="router-status">
            <h3>Stare Router Interfețe: <span id="router-mode">Așteptare conectare plăci...</span></h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
