<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PlugAndPlayBro Cloud IoT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { text-align: center; font-family: Arial, sans-serif; transition: background 0.5s; padding: 20px; color: #2c3e50; background-color: #f5f6fa; }
    h1 { margin-bottom: 5px; }
    h4 { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }
    .btn { display: block; width: 85%; max-width: 320px; margin: 15px auto; padding: 18px; font-size: 20px; color: white; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .status-box { padding: 25px; margin: 20px auto; border: 3px solid #2ecc71; border-radius: 12px; max-width: 400px; font-size: 22px; font-weight: bold; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <h1>PlugAndPlayBro OS</h1>
  <h4>Sistem de Securitate IoT v3</h4>
  
  <!-- Caseta de stare conectată prin satelit la ThingSpeak -->
  <div id="statusBox" class="status-box">Se conectează la Cloud...</div>

  <!-- BUTOANELE GLOBALE (Trimit comenzi de pe orice net) -->
  <button onclick="trimiteComandaCloud(2)" class="btn" style="background-color: #34495e;">🔒 ARMEAZĂ ALARMA</button>
  <button onclick="trimiteComandaCloud(3)" class="btn" style="background-color: #2ecc71;">💡 APRINDE LUMINA (SERVO)</button>
  <button onclick="trimiteComandaCloud(0)" class="btn" style="background-color: #7f8c8d;">🔓 DEZARMEAZĂ / RESET</button>

  <script>
    // ===================================================
    // COPIAZĂ ȘI PUNE AICI DATELE TALE EXACT DIN THINGSPEAK:
    const CHANNEL_ID = "PUNE_AICI_CIFRELE_CHANNEL_ID"; 
    const WRITE_API_KEY = "PUNE_AICI_WRITE_API_KEY_VERDE"; 
    const READ_API_KEY = "PUNE_AICI_READ_API_KEY_NEAGRA"; 
    // ===================================================

    // Trimite numărul stării direct în baza de date ThingSpeak
    function trimiteComandaCloud(valoare) {
      const url = `https://thingspeak.com{WRITE_API_KEY}&field1=${valoare}`;
      fetch(url)
        .then(response => {
          console.log("Comandă trimisă: " + valoare);
        })
        .catch(err => alert("Eroare de rețea: " + err));
    }

    // Verifică starea din 3 în 3 secunde pentru a actualiza ecranul telefonului
    function verificaSistemCloud() {
      const url = `https://thingspeak.com{CHANNEL_ID}/fields/1/last.json?api_key=${READ_API_KEY}`;
      
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const stare = parseInt(data.field1);
          const statusBox = document.getElementById("statusBox");
          
          if (stare === 1) {
            document.body.style.backgroundColor = "#c0392b"; // Alertă Intrus (Roșu)
            document.body.style.color = "white";
            statusBox.innerHTML = "🚨 INTRUS DETECTAT ÎN CAMERĂ!";
            statusBox.style.borderColor = "white";
            statusBox.style.color = "#c0392b";
          } else if (stare === 2) {
            document.body.style.backgroundColor = "#f39c12"; // Mod Pază (Portocaliu)
            document.body.style.color = "white";
            statusBox.innerHTML = "🔒 Alarma este ACTIVĂ (Pază)";
            statusBox.style.borderColor = "white";
            statusBox.style.color = "#f39c12";
          } else if (stare === 3) {
            document.body.style.backgroundColor = "#2ecc71"; // Motor în funcțiune (Verde)
            document.body.style.color = "white";
            statusBox.innerHTML = "💡 Lumina este APRINSĂ (Servo)";
            statusBox.style.borderColor = "white";
            statusBox.style.color = "#2ecc71";
          } else {
            document.body.style.backgroundColor = "#f5f6fa"; // Mod dezarmat normal
            document.body.style.color = "#2c3e50";
            statusBox.innerHTML = "✅ Alarma este OPRITĂ (Sigur)";
            statusBox.style.borderColor = "#2ecc71";
            statusBox.style.color = "#2ecc71";
          }
        })
        .catch(err => console.log("Se așteaptă date..."));
    }

    setInterval(verificaSistemCloud, 3000);
    verificaSistemCloud();
  </script>
</body>
</html>
