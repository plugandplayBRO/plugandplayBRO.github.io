<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Fight Bros Multiplayer 🥊</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: #fff; }
    #game-arena {
      width: 600px; height: 300px; border: 4px solid #fff;
      margin: 20px auto; position: relative; background: #333; overflow: hidden;
    }
    .player {
      width: 40px; height: 40px; position: absolute; bottom: 20px;
      border-radius: 4px; transition: left 0.1s ease;
    }
    #p1 { background: #ff4757; left: 50px; }
    #p2 { background: #2ed573; right: 50px; }
    
    /* Efectul de clipire când își ia damage ⚡ */
    .damage-blink {
      animation: blink 0.15s infinite;
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>Fight Bros 🥊</h2>
  <div id="game-arena">
    <div id="p1" class="player"></div>
    <div id="p2" class="player"></div>
  </div>

  <p>Comenzi: <strong>DASH</strong> 💨 | <strong>ATTACK</strong> ⚔️</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkrOZEsnzArIOw90wLq2yFNfNGfvk5C1A",
      authDomain: "broos-network.firebaseapp.com",
      projectId: "broos-network",
      storageBucket: "broos-network.firebasestorage.app",
      messagingSenderId: "592892049153",
      appId: "1:592892049153:web:64823347938791559e4d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const p1El = document.getElementById('p1');
    const p2El = document.getElementById('p2');

    // Funcție pentru declanșarea efectului de clipire la damage ⚡
    function triggerDamageEffect(playerElement) {
      playerElement.classList.add('damage-blink');
      setTimeout(() => {
        playerElement.classList.remove('damage-blink');
      }, 500); // Clipește timp de 0.5 secunde
    }

    // Ascultăm acțiunile din Firebase
    onValue(ref(db, 'fight_bros/actions'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.type === 'ATTACK') {
        // Dacă jucătorul atacat este în rază, clipește
        const targetEl = data.target === 'p1' ? p1El : p2El;
        triggerDamageEffect(targetEl);
      }
    });

    // Exemplu de trimitere a unei acțiuni (poate fi legat de taste sau Serial Web/Arduino)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a') {
        // Trimitere Atac către P2
        set(ref(db, 'fight_bros/actions'), {
          sender: 'p1',
          target: 'p2',
          type: 'ATTACK',
          time: Date.now()
        });
      }
    });
  </script>
</body>
</html>
