<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoRun - BroOS Router Online & Local</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #ff9800; color: white; border: none; padding: 12px 20px; margin: 8px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 85%; }
        button:hover { background: #e68900; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: none; background: #2d2d2d; color: #fff; width: 65%; font-size: 14px; }
        .box { background: #2d2d2d; padding: 12px; border-radius: 8px; margin: 12px 0; text-align: left; }
        .back-btn { background: #555; display: inline-block; padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Înapoi la Meniu</a>
        <h2>DinoRun - Controler & Router</h2>
        
        <!-- Status Conexiune Placă -->
        <div class="box">
            <p>Placă BroOS: <span id="connStatus" style="color:red; font-weight:bold;">Deconectat</span></p>
            <button id="connectBtn" style="background:#4CAF50;">Conectare Placă Serială</button>
        </div>

        <!-- Selector Mod de Joc -->
        <div class="box">
            <h3>Alege Modul de Joc</h3>
            <button id="btnLocal" style="background: #2196F3;">Mod Local (1 singur BroOS)</button>
            <button id="btnOnline" style="background: #9c27b0;">Mod Online (2 BroOS + Laptop Router)</button>
        </div>

        <!-- Panou Online -->
        <div id="onlinePanel" class="box" style="display: none; border: 1px dashed #9c27b0;">
            <h3>Sincronizare Online (Router)</h3>
            <p>Status Rețea: <span id="wsStatus" style="color:orange;">Neconectat la cameră</span></p>
            <input type="text" id="roomInput" placeholder="Nume Cameră (ex: BroRoom123)">
            <button id="joinRoomBtn" style="background: #00bcd4;">Conectare în Cameră</button>
            <p style="font-size: 12px; color: #aaa; margin-top: 8px;">
                💡 Asigură-te că ambele laptopuri folosesc exact același nume de cameră.
            </p>
        </div>

        <hr style="border-color: #444; margin: 15px 0;">
        <button id="btnJump1" style="background: #2196F3; font-size: 18px; padding: 15px;">SARE MANUAL (Test)</button>
    </div>

    <script>
        let port = null;
        let writer = null;
        let reader = null;
        let keepReading = false;
        let ws = null;
        let isOnlineMode = false;

        // 1. Conexiune Web Serial cu placa Arduino
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                
                document.getElementById('connStatus').innerText = "Conectat";
                document.getElementById('connStatus').style.color = "#4CAF50";

                keepReading = true;
                readSerialLoop();
                alert("Placa BroOS a fost conectată cu succes!");
            } catch (err) {
                alert("Eroare conectare serială: " + err);
            }
        });

        // 2. Citire date de la placă
        async function readSerialLoop() {
            while (port && port.readable && keepReading) {
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                try {
                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            buffer += value;
                            let lines = buffer.split('\n');
                            buffer = lines.pop();
                            for (let line of lines) {
                                handleArduinoCommand(line.trim());
                            }
                        }
                    }
                } catch (error) {
                    console.error("Eroare citire serială:", error);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function handleArduinoCommand(cmd) {
            console.log("Primit de la BroOS:", cmd);
            if (cmd === "DINO:JUMP") {
                if (isOnlineMode && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "DINO_JUMP" }));
                    console.log("Comandă trimisă prin routerul web spre celălalt laptop.");
                } else if (isOnlineMode) {
                    console.warn("Nu ești conectat la o cameră online!");
                }
            }
        }

        // 3. Comutare moduri
        document.getElementById('btnLocal').addEventListener('click', () => {
            isOnlineMode = false;
            document.getElementById('onlinePanel').style.display = 'none';
            alert("Mod Local activat!");
        });

        document.getElementById('btnOnline').addEventListener('click', () => {
            isOnlineMode = true;
            document.getElementById('onlinePanel').style.display = 'block';
        });

        // 4. Conectare WebSocket cu tratare robustă a erorilor
        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            let roomName = document.getElementById('roomInput').value.trim();
            if (!roomName) {
                alert("Te rog introdu un nume de cameră!");
                return;
            }

            document.getElementById('wsStatus').innerText = "Se conectează...";
            document.getElementById('wsStatus').style.color = "orange";

            // Folosim un format stabil de endpoint pentru teste
            let wsUrl = `wss://socketsbay.com/wss/v2/2/broos_${roomName}/`;

            if (ws) {
                ws.close();
            }

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    document.getElementById('wsStatus').innerText = "Conectat la routerul online!";
                    document.getElementById('wsStatus').style.color = "#4CAF50";
                };

                ws.onmessage = async (event) => {
                    let data;
                    try {
                        data = JSON.parse(event.data);
                    } catch(e) {
                        data = { type: event.data };
                    }

                    if (data.type === "DINO_JUMP") {
                        console.log("Salt primit de la celălalt jucător! Trimit spre Arduino.");
                        await sendToArduino("NET_IN:DINO2_JUMP");
                    }
                };

                ws.onerror = (err) => {
                    console.error("Eroare WebSocket:", err);
                    document.getElementById('wsStatus').innerText = "Eroare rețea (Server blocat/picat)";
                    document.getElementById('wsStatus').style.color = "red";
                };

                ws.onclose = () => {
                    console.log("Conexiunea WebSocket s-a închis.");
                };
            } catch(e) {
                alert("Eroare la crearea conexiunii: " + e);
                document.getElementById('wsStatus').innerText = "Eroare rețea";
                document.getElementById('wsStatus').style.color = "red";
            }
        });

        async function sendToArduino(cmd) {
            if (!writer) {
                alert("Atenție: Placa BroOS nu este conectată! Apasă mai întâi pe 'Conectare Placă Serială'.");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await writer.write(encoder.encode(cmd + "\n"));
            } catch (err) {
                console.error("Eroare la scrierea pe placă:", err);
            }
        }

        document.getElementById('btnJump1').addEventListener('click', async () => {
            await sendToArduino("DINO:JUMP");
        });
    </script>
</body>
</html>
