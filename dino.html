<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BroOS Web Console & Game Controller</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin-bottom: 20px; color: #60a5fa; }

    .status-bar {
      margin-bottom: 20px;
      padding: 10px 20px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ef4444;
      display: inline-block;
    }

    .dot.connected { background-color: #10b981; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      color: #93c5fd;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--accent-hover); }
    button:disabled { background-color: #475569; cursor: not-allowed; }

    textarea, input[type="text"] {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    textarea { resize: vertical; height: 80px; }

    .terminal {
      background-color: #000;
      color: #4ade80;
      font-family: 'Courier New', Courier, monospace;
      padding: 10px;
      border-radius: 6px;
      height: 120px;
      overflow-y: auto;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .big-btn {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      background-color: #10b981;
    }

    .big-btn:hover { background-color: #059669; }
  </style>
</head>
<body>

  <h1>🦖 BroOS Web Console & Controller</h1>

  <div class="status-bar">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Deconectat</span>
    <button id="connectBtn">Conectează Serial (USB)</button>
  </div>

  <div class="grid">

    <!-- CARD CONTROLLER -->
    <div class="card">
      <h2>🎮 Control MultiPlayer (Player 2)</h2>
      <p style="font-size: 0.9rem; color: #94a3b8;">Apasă <strong>SPACE</strong> pentru a sări în DinoRun Co-Op!</p>
      <button id="dinoJumpBtn" class="big-btn">🦘 SARI (SPACE / Player 2)</button>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 15px;">
        FightBros:<br>
        <strong>A</strong> = Stânga | <strong>D</strong> = Dreapta | <strong>W</strong> = Săritură<br>
        <strong>J</strong> = Atac | <strong>K</strong> = Super
      </p>
    </div>

    <!-- CARD FILE MANAGER -->
    <div class="card">
      <h2>📁 Trimite Fișier (FileManager)</h2>
      <textarea id="fileText" placeholder="Scrie textul fișierului aici (maxim 4 linii)..."></textarea>
      <input type="file" id="fileInput" accept=".txt" style="margin-bottom: 10px;">
      <button id="sendFileBtn">📤 Trimite Fișierul pe BroOS</button>
    </div>

    <!-- CARD BROCHAT -->
    <div class="card">
      <h2>💬 BroChat</h2>
      <div id="chatTerminal" class="terminal"></div>
      <input type="text" id="chatInput" placeholder="Scrie un mesaj...">
      <button id="sendChatBtn">Trimite Mesaj</button>
    </div>

  </div>

  <script>
    let port = null;
    let writer = null;
    let reader = null;
    let isConnected = false;

    const connectBtn = document.getElementById('connectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const dinoJumpBtn = document.getElementById('dinoJumpBtn');
    const sendFileBtn = document.getElementById('sendFileBtn');
    const fileText = document.getElementById('fileText');
    const fileInput = document.getElementById('fileInput');

    const chatTerminal = document.getElementById('chatTerminal');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');

    // --- CONECTARE USB DIRECTĂ ---
    connectBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        alert("Browser-ul nu suportă Web Serial API! Folosește Google Chrome sau Microsoft Edge pe PC.");
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        writer = port.writable.getWriter();
        isConnected = true;

        statusDot.classList.add('connected');
        statusText.innerText = "Conectat (115200 Baud)";
        connectBtn.disabled = true;

        readSerialLoop();
      } catch (err) {
        console.error(err);
        alert("Nu s-a putut realiza conexiunea: " + err.message);
      }
    });

    // --- CITIRE SERIALĂ ---
    async function readSerialLoop() {
      const textDecoder = new TextDecoderStream();
      const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      let lineBuffer = "";

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          lineBuffer += value;

          let lines = lineBuffer.split('\n');
          lineBuffer = lines.pop();

          for (let line of lines) {
            line = line.trim();
            if (line.length > 0) logToTerminal(line);
          }
        }
      } catch (err) {
        console.error("Eroare citire:", err);
      }
    }

    function logToTerminal(msg) {
      const p = document.createElement('div');
      p.innerText = msg;
      chatTerminal.appendChild(p);
      chatTerminal.scrollTop = chatTerminal.scrollHeight;
    }

    // --- TRIMITERE DATE CATRE ARDUINO ---
    async function sendCommand(cmd) {
      if (!isConnected || !writer) {
        alert("Conectează-te mai întâi prin USB!");
        return;
      }
      const encoder = new TextEncoder();
      const data = encoder.encode(cmd + "\n");
      await writer.write(data);
    }

    // --- CHAT ---
    sendChatBtn.addEventListener('click', () => {
      const msg = chatInput.value.trim();
      if (msg) {
        sendCommand(`CHAT_IN:Web:${msg}`);
        logToTerminal(`Tu: ${msg}`);
        chatInput.value = '';
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChatBtn.click();
    });

    // --- FILE MANAGER ---
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileReader = new FileReader();
        fileReader.onload = (event) => { fileText.value = event.target.result; };
        fileReader.readAsText(file);
      }
    });

    sendFileBtn.addEventListener('click', async () => {
      const content = fileText.value.trim();
      if (!content) { alert("Introduceți text în căsuță!"); return; }

      const lines = content.split('\n');
      await sendCommand("FILE_START");
      await new Promise(r => setTimeout(r, 120));

      const maxLines = Math.min(lines.length, 4);
      for (let i = 0; i < maxLines; i++) {
        let line = lines[i].trim();
        if (line) {
          await sendCommand(`FILE_LINE:${line}`);
          await new Promise(r => setTimeout(r, 120));
        }
      }

      await sendCommand("FILE_END");
      alert("Fișier trimis pe BroOS!");
    });

    // --- JOCURI ---
    dinoJumpBtn.addEventListener('click', () => { sendCommand("DINO2:JUMP"); });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

      if (e.code === 'Space') { e.preventDefault(); sendCommand("DINO2:JUMP"); }
      else if (e.key === 'a' || e.key === 'A') sendCommand("OPP:LEFT");
      else if (e.key === 'd' || e.key === 'D') sendCommand("OPP:RIGHT");
      else if (e.key === 'w' || e.key === 'W') sendCommand("OPP:JUMP");
      else if (e.key === 'j' || e.key === 'J') sendCommand("OPP:ATK");
      else if (e.key === 'k' || e.key === 'K') sendCommand("OPP:SUPER");
    });
  </script>
</body>
</html>
