<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DinoRun - Multiplayer</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: monospace; text-align: center; margin-top: 30px; }
        #track { width: 600px; height: 150px; background: #222; margin: 20px auto; position: relative; border: 2px solid yellow; overflow: hidden; }
        .dino { position: absolute; bottom: 0; width: 30px; height: 40px; background: yellow; text-align: center; line-height: 40px; color: #000; font-weight: bold; }
        #dino1 { left: 40px; }
        #dino2 { left: 90px; background: orange; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 8px 16px; background: #444; color: yellow; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>DinoRun Multiplayer</h1>
    <div id="track">
        <div id="dino1" class="dino">D1</div>
        <div id="dino2" class="dino">D2</div>
    </div>
    <br>
    <a href="index.html" class="back-btn">&#8592; Înapoi la Meniu</a>
</body>
</html>
