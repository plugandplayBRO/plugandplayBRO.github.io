<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoRun - Controler</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        button { background: #ff9800; color: white; border: none; padding: 20px; margin: 10px; border-radius: 8px; font-size: 20px; cursor: pointer; width: 80%; }
        button:hover { background: #e68900; }
        .back-btn { background: #555; display: inline-block; padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Înapoi la Meniu</a>
        <h2>DinoRun Controler</h2>
        <p>Status: <span id="connStatus" style="color:red; font-weight:bold;">Deconectat</span></p>
        <button id="connectBtn" style="background:#4CAF50; padding: 12px; font-size: 16px;">Conectare Placă</button>
        <hr style="border-color: #444; margin: 20px 0;">
        <button id="btnJump1" style="background: #2196F3;">SARE (Dino 1)</button>
        <button id="btnJump2" style="background: #9c27b0;">SARE (Dino 2 / Multiplayer)</button>
    </div>

    <script>
        let port = null;
        let writer = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                document.getElementById('connStatus').innerText = "Conectat";
                document.getElementById('connStatus').style.color = "#4CAF50";
            } catch (err) {
                alert("Eroare conectare: " + err);
            }
        });

        async function sendCmd(cmd) {
            if (!writer) {
                alert("Conectează mai întâi placa Arduino!");
                return;
            }
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + "\n"));
        }

        document.getElementById('btnJump1').addEventListener('click', () => sendCmd("DINO:JUMP"));
        document.getElementById('btnJump2').addEventListener('click', () => sendCmd("NET_IN:DINO2_JUMP"));
    </script>
</body>
</html>
