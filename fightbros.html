<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS - FightBros</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; text-align: center; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        button { background-color: #1e1e1e; color: #fff; border: 1px solid #444; padding: 15px 25px; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 5px; }
        button:hover { background-color: #333; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .status { font-weight: bold; color: #ff5252; }
        .status.connected { color: #4CAF50; }
        .nav-back { display: inline-block; text-decoration: none; color: #fff; margin-bottom: 15px; float: left; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← Înapoi la Meniu</a>

    <header>
        <h1>FightBros Controller</h1>
        <div>
            <span id="statusText" class="status">Deconectat</span>
            <button id="connectBtn" onclick="toggleConnection()">Conectare Arduino</button>
        </div>
    </header>

    <p>Folosește controalele de mai jos pentru a trimite comenzi către Arduino în timpul meciului:</p>

    <div class="controls">
        <button onclick="sendCmd('P:LEFT')">⬅️ Stânga</button>
        <button onclick="sendCmd('P:JUMP')">⬆️ Salt P1</button>
        <button onclick="sendCmd('P:ATK')">⚔️ Atac</button>
        <button onclick="sendCmd('P:RIGHT')">➡️ Dreapta</button>
    </div>
    <div class="controls">
        <button onclick="sendCmd('P2:JUMP')" style="background-color: #2c1e1e;">🔴 Salt Player 2</button>
    </div>

    <script>
        let port, writer;
        async function toggleConnection() {
            if (port) {
                await port.close(); port = null;
                document.getElementById('statusText').innerText = "Deconectat";
                document.getElementById('statusText').className = "status";
                document.getElementById('connectBtn').innerText = "Conectare Arduino";
            } else {
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    document.getElementById('statusText').innerText = "Conectat";
                    document.getElementById('statusText').className = "status connected";
                    document.getElementById('connectBtn').innerText = "Deconectare";
                } catch (err) { console.error(err); }
            }
        }

        async function sendCmd(data) {
            if (!port) { alert("Conectează mai întâi Arduino!"); return; }
            const textEncoder = new TextEncoderStream();
            textEncoder.readable.pipeTo(port.writable);
            writer = textEncoder.writable.getWriter();
            await writer.write(data + "\n");
            writer.releaseLock();
        }
    </script>
</body>
</html>
