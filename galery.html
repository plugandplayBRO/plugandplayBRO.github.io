<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS - Galerie</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        button { background: #ff9800; color: white; border: none; padding: 15px 20px; margin: 8px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 45%; }
        button:hover { background: #e68900; }
        .full-btn { width: 92%; background: #2196F3; }
        .full-btn:hover { background: #0b7dda; }
        .back-btn { background: #555; display: inline-block; padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Înapoi la Meniu</a>
        <h2>Galerie & Pixel Art</h2>
        <p>Status: <span id="connStatus" style="color:red; font-weight:bold;">Deconectat</span></p>
        <button id="connectBtn" class="full-btn" style="background:#4CAF50;">Conectare Placă</button>
        <hr style="border-color: #444; margin: 20px 0;">
        <button id="btnMode" class="full-btn">Deschide Galerie pe LCD</button>
        <div>
            <button id="btnPrev">&larr; Anterior</button>
            <button id="btnNext">Următor &rarr;</button>
        </div>
    </div>

    <script>
        let port = null;
        let writer = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                document.getElementById('connStatus').innerText = "Conectat";
                document.getElementById('connStatus').style.color = "#4CAF50";
            } catch (err) {
                alert("Eroare conectare: " + err);
            }
        });

        async function sendCmd(cmd) {
            if (!writer) {
                alert("Conectează mai întâi placa Arduino!");
                return;
            }
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + "\n"));
        }

        document.getElementById('btnMode').addEventListener('click', () => sendCmd("MODE:GALLERY"));
        document.getElementById('btnPrev').addEventListener('click', () => sendCmd("GAL:PREV"));
        document.getElementById('btnNext').addEventListener('click', () => sendCmd("GAL:NEXT"));
    </script>
</body>
</html>
