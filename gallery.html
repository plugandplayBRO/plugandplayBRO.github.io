<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>BroOS - Galerie</title>
    <style>
        body { background: #121212; color: #fff; font-family: monospace; text-align: center; margin-top: 30px; }
        .gallery-grid { display: flex; justify-content: center; gap: 15px; margin: 20px; flex-wrap: wrap; }
        .photo-card { background: #222; border: 1px solid #00ffcc; padding: 10px; border-radius: 5px; width: 150px; }
        .photo-card img { width: 100%; height: 100px; object-fit: cover; background: #444; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 8px 16px; background: #444; color: #00ffcc; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Galerie Foto BroOS</h1>
    <p>Imagini salvate în sistem (inclusiv Țipo)</p>

    <div class="gallery-grid">
        <div class="photo-card">
            <img src="tipo.jpg" alt="Țipo">
            <p>Țipo</p>
        </div>
        <!-- Poți adăuga mai multe carduri foto aici -->
    </div>

    <a href="index.html" class="back-btn">&#8592; Înapoi la Meniu</a>
</body>
</html>
