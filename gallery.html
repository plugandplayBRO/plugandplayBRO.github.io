<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BroOS - Galeria Pixel Art</title>
  <style>
    body {
      background-color: #0f0f15;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 5px; color: #00e676; }
    p { color: #aaa; margin-bottom: 20px; }
    
    .nav-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
      text-decoration: none;
    }
    .nav-btn:hover { background: #444; }

    .editor-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      background: #181824;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #333;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(16, 20px);
      grid-template-rows: repeat(16, 20px);
      gap: 1px;
      background: #222;
      border: 2px solid #00e676;
    }

    .pixel {
      width: 20px;
      height: 20px;
      background: #111;
      cursor: pointer;
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 180px;
    }

    .btn {
      background: #00e676;
      border: none;
      color: #000;
      padding: 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #00c853; }
    .btn-clear { background: #ff5252; color: #fff; }
    .btn-clear:hover { background: #d50000; }

    label { font-size: 14px; color: #ccc; }
    input[type="color"] {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
  </style>
</head>
<body>

  <a href="index.html" class="nav-btn">⬅ Înapoi la Meniu</a>
  <h1>🎨 Editor & Galerie Pixel Art</h1>
  <p>Creează skin-uri pentru caracterele tale din Fight Bros!</p>

  <div class="editor-container">
    <div id="grid"></div>

    <div class="tools">
      <label for="colorPicker">Culoare Pixel:</label>
      <input type="color" id="colorPicker" value="#00e676">

      <button class="btn" onclick="saveArt()">💾 Salvează Skin</button>
      <button class="btn" onclick="sendSkinToLCD()">📺 Trimite pe LCD</button>
      <button class="btn btn-clear" onclick="clearGrid()">🗑️ Șterge Canvas</button>
    </div>
  </div>

  <script src="app.js"></script>

  <script>
    const grid = document.getElementById('grid');
    const colorPicker = document.getElementById('colorPicker');
    let isDrawing = false;

    // Generăm grila de 16x16 pixeli
    for (let i = 0; i < 256; i++) {
      const pixel = document.createElement('div');
      pixel.classList.add('pixel');
      
      pixel.addEventListener('mousedown', () => {
        isDrawing = true;
        pixel.style.backgroundColor = colorPicker.value;
      });

      pixel.addEventListener('mouseenter', () => {
        if (isDrawing) {
          pixel.style.backgroundColor = colorPicker.value;
        }
      });

      grid.appendChild(pixel);
    }

    window.addEventListener('mouseup', () => { isDrawing = false; });

    function clearGrid() {
      const pixels = document.querySelectorAll('.pixel');
      pixels.forEach(p => p.style.backgroundColor = '#111');
    }

    function saveArt() {
      alert("Skin-ul Pixel Art a fost salvat în memoria locală a browserului!");
    }

    function sendSkinToLCD() {
      if (typeof sendToArduino === 'function') {
        sendToArduino("CHAT_IN:Skin Incarcat!");
        alert("Notificare trimisă pe ecranul BroOS!");
      } else {
        alert("Conectează mai întâi BroOS prin USB din meniul principal!");
      }
    }
  </script>
</body>
</html>
