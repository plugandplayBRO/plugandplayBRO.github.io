<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS - Chat & Fișiere</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        button, input { padding: 10px; margin: 5px; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #ff9800; color: white; cursor: pointer; }
        button:hover { background: #e68900; }
        input { background: #2d2d2d; color: #fff; width: 60%; }
        .box { background: #2d2d2d; padding: 10px; border-radius: 5px; margin: 10px 0; text-align: left; height: 120px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .back-btn { background: #555; display: inline-block; padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Înapoi la Meniu</a>
        <h2>BroChat & File Manager</h2>
        <p>Status: <span id="connStatus" style="color:red; font-weight:bold;">Deconectat</span></p>
        <button id="connectBtn" style="background:#4CAF50;">Conectare Placă</button>

        <hr style="border-color: #444; margin: 15px 0;">

        <h3>BroChat</h3>
        <div id="chatLog" class="box">Așteptare mesaje...</div>
        <div>
            <input type="text" id="chatInput" placeholder="Scrie un mesaj...">
            <button id="sendChatBtn">Trimite</button>
        </div>

        <hr style="border-color: #444; margin: 15px 0;">

        <h3>File Manager</h3>
        <button id="getFileBtn" style="background: #2196F3;">Citește Fișierele din Arduino</button>
        <div id="fileLog" class="box">Niciun fișier încărcat.</div>
    </div>

    <script>
        let port = null;
        let writer = null;
        let reader = null;
        let keepReading = false;
        let fileBufferHtml = "";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                
                document.getElementById('connStatus').innerText = "Conectat";
                document.getElementById('connStatus').style.color = "#4CAF50";

                keepReading = true;
                readSerialLoop();
            } catch (err) {
                alert("Eroare conectare: " + err);
            }
        });

        async function readSerialLoop() {
            while (port && port.readable && keepReading) {
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                try {
                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            buffer += value;
                            let lines = buffer.split('\n');
                            buffer = lines.pop(); // Păstrează fragmentul incomplet
                            for (let line of lines) {
                                handleIncoming(line.trim());
                            }
                        }
                    }
                } catch (error) {
                    console.error("Eroare citire:", error);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function handleIncoming(line) {
            if (!line) return;
            let chatLog = document.getElementById('chatLog');
            let fileLog = document.getElementById('fileLog');

            if (line.startsWith("CHAT:")) {
                chatLog.innerText += "\n" + line.substring(5);
                chatLog.scrollTop = chatLog.scrollHeight;
            } 
            else if (line === "FILE_START") {
                fileBufferHtml = "";
                fileLog.innerHTML = "Se încarcă fișierele...\n";
            } 
            else if (line.startsWith("FILE_LINE:")) {
                fileBufferHtml += line.substring(10) + "<br>";
            } 
            else if (line === "FILE_END") {
                fileLog.innerHTML = fileBufferHtml || "Fișier gol.";
            }
        }

        async function sendCmd(cmd) {
            if (!writer) {
                alert("Conectează mai întâi placa Arduino!");
                return;
            }
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + "\n"));
        }

        document.getElementById('sendChatBtn').addEventListener('click', () => {
            let input = document.getElementById('chatInput');
            if (input.value.trim() !== "") {
                let msg = "WebUser: " + input.value;
                sendCmd("CHAT_IN:" + input.value);
                let chatLog = document.getElementById('chatLog');
                chatLog.innerText += "\n" + msg;
                chatLog.scrollTop = chatLog.scrollHeight;
                input.value = "";
            }
        });

        document.getElementById('getFileBtn').addEventListener('click', () => {
            sendCmd("MODE:FILE");
        });
    </script>
</body>
</html>
