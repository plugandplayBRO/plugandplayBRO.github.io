<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS - Mesaje & Fișiere</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        button, input {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background-color: #333; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        .panel h2 { margin-top: 0; font-size: 18px; color: #4CAF50; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .log-box {
            flex-grow: 1;
            background-color: #0f0f0f;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input { flex-grow: 1; }
        .status { font-weight: bold; color: #ff5252; }
        .status.connected { color: #4CAF50; }
        .nav-back { margin-bottom: 15px; display: inline-block; text-decoration: none; color: #fff; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← Înapoi la Meniu</a>

    <header>
        <h1>BroOS Mesaje & Fișiere</h1>
        <div>
            <span id="statusText" class="status">Deconectat</span>
            <button id="connectBtn" onclick="toggleConnection()">Conectare Arduino</button>
        </div>
    </header>

    <div class="container">
        <!-- Panou BroChat -->
        <div class="panel">
            <h2>BroChat</h2>
            <div id="chatLog" class="log-box"></div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Scrie mesaj..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">Trimite</button>
            </div>
        </div>

        <!-- Panou File Manager -->
        <div class="panel">
            <h2>File Manager</h2>
            <div id="fileLog" class="log-box">Apasă pe "Citește Fișiere" pentru a prelua datele din Arduino...</div>
            <div class="input-group">
                <button onclick="requestFiles()">Citește Fișiere</button>
            </div>
        </div>
    </div>

    <script>
        let port;
        let reader;
        let writer;
        let inputStreamClosed;

        async function toggleConnection() {
            if (port) {
                await disconnectSerial();
            } else {
                await connectSerial();
            }
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                document.getElementById('statusText').innerText = "Conectat";
                document.getElementById('statusText').className = "status connected";
                document.getElementById('connectBtn').innerText = "Deconectare";

                readLoop();
            } catch (err) {
                console.error("Eroare la conectare:", err);
            }
        }

        async function disconnectSerial() {
            if (reader) {
                await reader.cancel();
                await inputStreamClosed.catch(() => {});
            }
            if (port) {
                await port.close();
                port = null;
            }
            document.getElementById('statusText').innerText = "Deconectat";
            document.getElementById('statusText').className = "status";
            document.getElementById('connectBtn').innerText = "Conectare Arduino";
        }

        async function sendData(data) {
            if (!port) {
                alert("Conectează mai întâi Arduino!");
                return;
            }
            const textEncoder = new TextEncoderStream();
            inputStreamClosed = textEncoder.readable.pipeTo(port.writable);
            writer = textEncoder.writable.getWriter();
            await writer.write(data + "\n");
            writer.releaseLock();
        }

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            inputStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) handleIncoming(value);
                }
            } catch (error) {
                console.error("Eroare la citire:", error);
            }
        }

        function handleIncoming(text) {
            let lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // Dacă vine mesaj de chat de la Arduino
                if (line.startsWith("CHAT:")) {
                    appendChat(line.substring(5));
                }
            }
        }

        function appendChat(msg) {
            const chatLog = document.getElementById('chatLog');
            chatLog.innerHTML += `<div>${msg}</div>`;
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (!val) return;
            
            // Trimite spre Arduino formatul interpretat de BroOS
            sendData("CHAT_IN:" + val);
            appendChat("WebUser: " + val);
            input.value = "";
        }

        function requestFiles() {
            const fileLog = document.getElementById('fileLog');
            fileLog.innerHTML = "Se citesc fișierele din Arduino... (asigură-te că ești în meniul FileManager)";
            // Poți trimite comenzi personalizate sau poți citi direct din starea curentă
            sendData("MODE:FILE");
        }
    </script>
</body>
</html>
